[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "management-evidence"
version = "0.1.0"
requires-python = ">=3.10"
description = "Primary-source management evidence collection"

[project.scripts]
management-evidence = "credibility.__main__:main"
management-archive = "credibility.archive:main"
management-ledger = "credibility.ledger:main"
management-presentation = "credibility.presentation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credibility = ["examples/*.json"]
